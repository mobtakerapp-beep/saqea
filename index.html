<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الثقة بالنفس</title><style>:root{--bg:#fdf6e9;--cd:#fff;--tx:#2b2b3a;--ac:#c62f4a;--ok:#2e9d5b;--no:#d9534f;--bd:#e8d9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1b24;--cd:#2a2735;--tx:#f1eee8;--bd:#443f55}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:12px}
h1,h2{text-align:center;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--cd);border:2px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;text-align:center}
.card img{width:100%;height:100px;object-fit:cover;display:block}.card b{display:block;padding:6px 4px 2px;font-size:14px}.card small{display:block;padding-bottom:6px;color:var(--ac)}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;margin:3px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.msg{text-align:center;font-size:18px;margin:10px;min-height:26px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:auto}
.c{aspect-ratio:1;border-radius:12px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;overflow:hidden;text-align:center;font-size:13px}
.c img{width:100%;height:100%;object-fit:cover}.c.f{background:var(--cd);color:var(--tx);border:2px solid var(--bd);padding:3px}.c.d{outline:3px solid var(--ok)}
.q{max-width:520px;margin:auto}.q .pic{width:100%;aspect-ratio:1.2;border-radius:14px;background-size:cover;background-position:center;border:2px solid var(--bd)}
.o{display:block;width:100%;margin:6px 0;padding:11px;border-radius:12px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;cursor:pointer}
.o.ok{background:var(--ok);color:#fff}.o.no{background:var(--no);color:#fff}.tm{height:8px;background:var(--ac);border-radius:4px;transition:width linear}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:auto}.mt>div{display:grid;gap:6px}
.mi{height:76px;border-radius:10px;background-size:cover;background-position:center;border:3px solid var(--bd);cursor:pointer}.mx{padding:8px;font-size:13px;border-radius:10px;border:3px solid var(--bd);background:var(--cd);cursor:pointer;display:flex;align-items:center;min-height:76px}
.s{border-color:var(--ac)!important}.dn{border-color:var(--ok)!important;opacity:.5;pointer-events:none}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:auto}.th div{aspect-ratio:1.2;background-size:cover;border-radius:10px;cursor:pointer;border:2px solid var(--bd)}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:420px;margin:8px auto;direction:ltr}.pz div{aspect-ratio:1;background-size:300% 300%;cursor:pointer;border:3px solid transparent}
.pw{position:relative;max-width:460px;margin:8px auto;direction:ltr;background:#fff;border-radius:10px;overflow:hidden;touch-action:none}.pw canvas{display:block;width:100%;background:#fff}.pw img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.pl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pl i{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);cursor:pointer}.ot{aspect-ratio:1;background-size:cover;background-position:center;border-radius:12px;border:4px solid var(--bd);cursor:pointer;transition:transform .2s,border-color .2s}.ot.ok{border-color:var(--ok)}.ot.no{border-color:var(--no)}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:8px auto}.og.t2{grid-template-columns:1fr 1fr;max-width:360px}.pic{overflow:hidden;position:relative}
.cv{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}.cv i{background:var(--ac);border:1px solid #fff;cursor:pointer}.qh{text-align:center;margin:22px 0 6px;color:var(--ac);border-top:2px dashed var(--bd);padding-top:14px}.ft{text-align:center;margin:28px auto 10px;padding-top:14px;border-top:2px dashed var(--bd);font-size:20px;line-height:1.9;max-width:900px}</style></head><body><div id="app"></div><div class=ft>الأخصائية الاجتماعية: أحلام الصواعي<br>مديرة المدرسة: شيخة المطاعني</div><script>

zoom(e){const q=sh(R6);rounds(e,6,n=>{const k=q[n];return{a:k,h:`<div class=q>${pic(k,`background-size:520%;background-position:${Math.random()*100}% ${Math.random()*100}%`)}<p class=msg>هذا جزء من أي صورة؟</p><div class=og>${opts(k).map(c=>tile(c)).join('')}</div></div>`}})},
blur(e){const q=sh(R6);rounds(e,6,n=>{const k=q[n];return{a:k,h:`<div class=q>${pic(k,'filter:blur(18px);transform:scale(1.1)')}<p class=msg>أي صورة هذه؟</p><div class=og>${opts(k).map(c=>tile(c)).join('')}</div></div>`}})},
reveal(e){const q=sh(R6);rounds(e,6,n=>{const k=q[n];return{a:k,h:`<div class=q><div class=pic style="background-image:url(${P(k)})"><div class=cv>${'<i></i>'.repeat(12)}</div></div><p class=msg>اضغط المربعات لتكشف الصورة ثم اختر</p><div class=og>${opts(k).map(c=>tile(c)).join('')}</div></div>`,f:()=>e.querySelectorAll('.cv i').forEach(i=>i.onclick=()=>i.remove())}})},
mirror(e){const q=sh(R6);rounds(e,6,n=>{const k=q[n],o=sh([['n',''],['m','transform:scaleX(-1)']]);return{a:'n',h:`<div class=q>${pic(k)}<p class=msg>أي صورة تطابق الأصلية تمامًا؟</p><div class="og t2">${o.map(([i,x])=>tile(k,x,i)).join('')}</div></div>`}})},
hue(e){const q=sh(R6),F=['','filter:hue-rotate(110deg)','filter:hue-rotate(230deg)'];rounds(e,6,n=>{const k=q[n],o=sh([0,1,2]);return{a:0,h:`<div class=q><p class=msg>أي صورة ألوانها الأصلية؟</p><div class=og>${o.map(i=>tile(k,F[i],i)).join('')}</div></div>`}})},
findsame(e){const q=sh(R6);rounds(e,6,n=>{const k=q[n];return{a:k,h:`<div class=q>${pic(k,'max-width:240px;margin:auto')}<p class=msg>اعثر على نفس الصورة بسرعة</p><div class=og>${sh(R6).map(c=>tile(c)).join('')}</div></div>`}})},
missing(e){const q=sh(R6);rounds(e,5,n=>{const S=sh(R6).slice(0,3),a=S[0],rest=S.slice(1),ot=sh([a,...R6.filter(x=>!S.includes(x)).slice(0,2)]);return{a,h:`<div class=q><p class=msg>احفظ الصور الثلاث 👀</p><div class=og id=sg>${S.map(k=>`<div class=ot style="background-image:url(${P(k)})"></div>`).join('')}</div><div class=og id=op style="visibility:hidden">${ot.map(c=>tile(c)).join('')}</div></div>`,f:()=>setTimeout(()=>{$('#sg').innerHTML=rest.map(k=>`<div class=ot style="background-image:url(${P(k)})"></div>`).join('')+'<div class=ot style="display:grid;place-items:center;font-size:40px;background:var(--cd)">؟</div>';$('#op').style.visibility='visible';document.querySelector('.q .msg').textContent='أي صورة اختفت؟'},3500)}})},
simon(e){e.innerHTML='<div class=og style="max-width:420px">'+R6.map(k=>`<div class=ot data-j=${k} style="background-image:url(${P(k)})"></div>`).join('')+'</div><div class=bar style="justify-content:center"><button class=b id=st>▶️ ابدأ</button></div>';
let seq=[],i=0,on=0;const ts=[...e.querySelectorAll('.ot')],fl=(k,c)=>{const d=ts[k-1];d.style.borderColor=c;d.style.transform='scale(1.08)';setTimeout(()=>{d.style.borderColor='';d.style.transform=''},450)};
const play=()=>{on=0;i=0;seq.push(1+Math.floor(Math.random()*6));msg(`المستوى ${seq.length} من 6 — شاهد الترتيب`);seq.forEach((k,j)=>setTimeout(()=>fl(k,'#c62f4a'),700*(j+1)));setTimeout(()=>{on=1;msg('دورك! اضغط الصور بنفس الترتيب')},700*seq.length+600)};
$('#st').onclick=()=>{seq=[];play()};
ts.forEach(d=>d.onclick=()=>{if(!on)return;const k=+d.dataset.j;if(k==seq[i]){fl(k,'#2e9d5b');if(++i==seq.length){on=0;if(seq.length==6)return msg('🏆 ممتاز! أكملت كل المستويات');msg('✅ أحسنت!');setTimeout(play,900)}}else{on=0;fl(k,'#d9534f');msg('❌ أخطأت — اضغط ابدأ للمحاولة من جديد')}})}};
go();
</script></body></html>
